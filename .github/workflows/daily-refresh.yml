name: Daily data refresh

# Keeps the live app's data current with zero manual work:
#   1. Figures out the current NBA season (e.g. "2025-26") from today's date.
#   2. Fetches that season's rosters + game logs via nba_api and merges
#      them into data/seed/*.csv with --append (existing seasons are
#      left untouched — see README "Adding a new season").
#   3. Rebuilds the DB locally and sanity-checks it (scripts/ci_sanity_check.py)
#      BEFORE committing anything, so a bad fetch never reaches the live app.
#   4. Commits and pushes only if the seed CSVs actually changed.
#
# Streamlit Community Cloud rebuilds data/nba_props.db from these CSVs
# on every deploy (the .db file itself is gitignored), so a push here
# is what makes the live app refresh — no separate deploy step needed.
#
# Runs once a day, well after the previous night's games are final.
# Trigger it manually any time from the Actions tab (workflow_dispatch)
# to test it or force an immediate refresh.

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Python buffers stdout when it isn't attached to a real terminal (true
  # for every step here), so without this, fetch_data.py's progress
  # prints (roster-by-roster, etc.) don't show up in the live log until
  # the buffer fills or the process exits — making a slow or stuck run
  # indistinguishable from a fast one until it's too late to tell which.
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # NBA's stats API sometimes blocks/rate-limits cloud
                          # IPs (GitHub's runners included) even when the
                          # same code works fine from a home connection —
                          # fail clearly instead of hanging for hours if so.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install nba_api pandas

      - name: Determine current NBA season
        id: season
        run: |
          # NBA seasons start in October, so a calendar year splits across
          # two seasons — e.g. Feb 2026 is still the "2025-26" season.
          season=$(python3 -c "
          from datetime import date
          today = date.today()
          start_year = today.year if today.month >= 10 else today.year - 1
          print(f'{start_year}-{str(start_year + 1)[-2:]}')
          ")
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "Refreshing season: $season"

      - name: Fetch latest data
        run: python3 scripts/fetch_data.py --season "${{ steps.season.outputs.season }}" --append --sleep 0.8

      - name: Rebuild + sanity-check before committing
        run: python3 scripts/ci_sanity_check.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/seed/; then
            echo "No data changes today — nothing to commit."
          else
            git add data/seed/
            git commit -m "Automated daily data refresh (${{ steps.season.outputs.season }})"
            git push
          fi
