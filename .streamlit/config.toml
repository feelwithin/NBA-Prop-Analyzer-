# Native Streamlit theming — this is the supported way to brand a
# Streamlit app (colors apply consistently to every built-in widget:
# buttons, sliders, selectboxes, metrics, tabs) rather than fragile
# CSS overrides that can break across Streamlit versions.
# FanDuel-inspired: dark navy base with a bright blue accent.
[theme]
base = "dark"
primaryColor = "#1D6FFF"
backgroundColor = "#0A1622"
secondaryBackgroundColor = "#131F30"
textColor = "#F2F5F8"
font = "sans serif"
